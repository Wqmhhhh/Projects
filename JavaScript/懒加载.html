<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>懒加载</title>
  </head>
  <body>
    <!doctype html>
    <html lang="zh">
      <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <style>
          img {
            width: 900px;
            margin: 50px auto;
            display: block;
          }
        </style>
      </head>
      <body>
        <img
          class="lazy"
          data-src="../pics/pic1.png"
          alt="Image 1"
          src="../pics/pic8.png"
        />
        <img
          class="lazy"
          data-src="../pics/pic2.png"
          alt="Image 2"
          src="../pics/pic8.png"
        />
        <img
          class="lazy"
          data-src="../pics/pic3.png"
          alt="Image 3"
          src="../pics/pic8.png"
        />
        <img
          class="lazy"
          data-src="../pics/pic4.png"
          alt="Image 4"
          src="../pics/pic8.png"
        />
        <img
          class="lazy"
          data-src="../pics/pic5.png"
          alt="Image 5"
          src="../pics/pic8.png"
        />
        <img
          class="lazy"
          data-src="../pics/pic1.png"
          alt="Image 1"
          src="../pics/pic8.png"
        />
        <img
          class="lazy"
          data-src="../pics/pic2.png"
          alt="Image 2"
          src="../pics/pic8.png"
        />
        <img
          class="lazy"
          data-src="../pics/pic3.png"
          alt="Image 3"
          src="../pics/pic8.png"
        />
        <img
          class="lazy"
          data-src="../pics/pic4.png"
          alt="Image 4"
          src="../pics/pic8.png"
        />
        <img
          class="lazy"
          data-src="../pics/pic5.png"
          alt="Image 5"
          src="../pics/pic8.png"
        />

        <script>
          document.addEventListener("DOMContentLoaded", () => {
            const images = document.querySelectorAll("img");
            const callback = (entries, observer) => {
              entries.forEach((entry) => {
                if (entry.isIntersecting) {
                  const img = entry.target;
                  img.src = img.dataset.src;
                  observer.unobserve(img); //停止观察当前元素
                }
              });
            };
            const options = {
              root: null, //默认为视口
              rootMargin: "0px", //没有外边距
              threshold: 0.3, //90%的元素可见时触发回调
            };
            const observer = new IntersectionObserver(callback, options);
            images.forEach((image) => {
              observer.observe(image);
            });
          });
        </script>
      </body>
    </html>
  </body>
</html>
