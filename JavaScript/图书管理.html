<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <link rel="stylesheet" href="../bootstrap.css">
  <title>图书管理</title>
  <style>
    *{
      box-sizing: border-box;
    }
    .top,table{
      width: 900px;
      display: block;
      margin: 0 auto;
      font-size: 20px;
      font-weight: bold;
      padding-left: 50px;
      height: 40px;
      line-height: 40px;
    }
    .add{
      color: white;
      background-color: rgb(45, 159, 212);
      border-radius: 2px;
      border: 0 ;
      font-size: 15px;
      width: 70px;
      height: 30px;
      line-height: 30px;
      text-align: center;
      position: relative;
      right: -650px;
    }
    table{
      padding-left: 0;
      font-size: 17px;
      background-color: #c7c3c3;
      height: 40px;
      width: 830px;
      border-collapse: collapse;
    }
    thead>tr>td{
      text-align: center;
      border-left: 3px solid rgb(243, 243, 243);
      color: rgba(255, 255, 255, 0.938);
      width: 170px;
    }
    .add-input{
      display: block;
      margin: 10px 0;
    }
    tbody{
      background-color: #ebeaea;
    }
    tbody>tr>td{
      text-align: left;
      font-size: 15px;
      font-weight: normal;
      border-left: 3px solid rgb(243, 243, 243);
      color: black;
      width: 170px;
      padding-left: 5px;
    }
    .delete,.change{
      display: inline-block;
      text-align: center;
      border: 1px solid black;
      width: 50px;
      line-height: 30px;
      height: 30px;
      margin-left: 17px;
    }
    .delete:hover,.change:hover{
      cursor: pointer;
      color: red;
      background-color: #dfdeded3;
    }
  </style>
</head>
<body>
  <div class="top">
    图书管理
    <button class="add"> + 添加</button>
  </div>
  <table>
    <thead>
      <tr>
        <td>序号</td>
        <td>书名</td>
        <td>作者</td>
        <td>出版社</td>
        <td>操作</td>
      </tr>
    </thead>
    <tbody>
    </tbody>
  </table>

  <!-- 新增弹框 -->
  <div class="modal fade add-modal" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
          <h4 class="modal-title">添加图书</h4>
        </div>
        <form class="add-form">
          <div class="modal-body">
            输入书名：<input type="text" class="add-input" name="bookname">
            输入作者：<input type="text" class="add-input" name="author">
            输入出版社：<input type="text" class="add-input" name="publisher">
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
            <button type="button" class="btn btn-primary add-save">保存</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- 编辑弹框 -->
  <div class="modal fade edit-modal" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
          <h4 class="modal-title">修改图书信息</h4>
        </div>
        <form class="edit-form">
          <div class="modal-body">
            输入书名：<input type="text" class="add-input change1" name="bookname">
            输入作者：<input type="text" class="add-input change2" name="author">
            输入出版社：<input type="text" class="add-input change3" name="publisher">
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
            <button type="button" class="btn btn-primary change-book">修改</button>
          </div>
        </form>
      </div>
    </div>
  </div>
 
  <!-- 引入相关文件 -->
  <script src="../jquery-1.12.4.min.js"></script>
  <script src="../bootstrap.js"></script>
  <script src="../form-serialize插件.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <script> 
    // 封装函数-获取并渲染图书列表
    const creator='wang'
    function getBook(){
      // 获取数据
      axios({
        url:'http://hmajax.itheima.net/api/books',
        params:{
          creator
        }
      }).then(result=>{
        // 将获取数据添加 HTML 标签后返回
        const booklist=result.data.data
        const Str=booklist.map((item,index)=>`    
           <tr>
            <td>${index+1}</td>
            <td>${item.bookname}</td>
            <td>${item.author}</td>
            <td>${item.publisher}</td>
            <td data-id=${item.id}>
              <div class="delete">删除</div> 
              <div class="change">编辑</div>
            </td>
          </tr>
          `).join('')              
          document.querySelector('tbody').innerHTML=Str     //渲染页面
      })
    } 
    getBook()

    const modal=$('.add-modal')     // 创建弹窗对象
    document.querySelector('.add').addEventListener('click',function(){
      modal.modal('show')     // 点击添加显示弹框
    })


    // 添加图书-点击保存隐藏弹框
    document.querySelector('.add-save').addEventListener('click',function(){
       // 收集表单数据
    const add_form=document.querySelector('.add-form')  
    const bookObj=serialize(add_form,{hash:true,empty:true})

      // 提交到服务器保存
      axios({
        url:'http://hmajax.itheima.net/api/books',
        method:'post',
        data:{
          ...bookObj,
          creator
        }
      }).then(result=>{
        getBook()     // 渲染
      add_form.reset()       // 重置输入表单
      modal.modal('hide') //隐藏弹框
      })
    })

    // 删除部分
    document.querySelector('tbody').addEventListener('click',e=>{
      if(e.target.classList.contains('delete')){
        // 获取删除元素的图书 id
        const Id=e.target.parentNode.dataset.id

        // 调用删除接口
        axios({
          url:`http://hmajax.itheima.net/api/books/${Id}`,   //路径传参
          method:'delete',
        }).then(result=>{
          getBook()        // 重新渲染
        })
      }
    })

     // 编辑部分
    const edit_modal=$('.edit-modal')
    document.querySelector('tbody').addEventListener('click',e=>{
      if(e.target.classList.contains('change')){
        edit_modal.modal('show')
        const Ids=e.target.parentNode.dataset.id
        axios({
          url:`http://hmajax.itheima.net/api/books/${Ids}`,       // 获取图书信息回填入表单
        }).then(result=>{
          const bookObj=result.data.data
          document.querySelector('.edit-form .change1').value=bookObj.bookname
          document.querySelector('.edit-form .change2').value=bookObj.author
          document.querySelector('.edit-form .change3').value=bookObj.publisher
        })
        document.querySelector('.change-book').addEventListener('click',function(){
      // 获取表单数据
      const edit_form=document.querySelector('.edit-form')
        const Obj=serialize(edit_form,{hash:true,empty:true})

        // 提交到服务器修改
        axios({
          url:`http://hmajax.itheima.net/api/books/${Ids}`,
          method:'put',
          data:{
           ...Obj,
            creator
          }
        }).then(result=>{
          getBook()     // 渲染
        })
        edit_modal.modal('hide') //隐藏弹框
        })
      }
    })

  </script>
</body>
</html>
