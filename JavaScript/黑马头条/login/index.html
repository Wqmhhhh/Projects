<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="../../../bootstrap.css"></script>
  <title>黑马头条-数据管理平台</title>
  <style>
    *{
      box-sizing: border-box;
    }
  html,body {
    height: 100%;
    background: url('./assets/login-bg.png') no-repeat center/cover;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* 提示框 */
  .alert{
    width: 400px;
    height: 50px;
    border-radius: 5px;
    text-align: center;
    line-height: 50px;
    position: fixed;
    top: 50px;
    left: 50%;
    transform: translateX(-50%);
    display: none;
  }
  .show{
    display: block !important;
  }
  .success{
    background-color: rgba(14, 241, 165, 0.418);
  }
  .danger{
    background-color: rgba(255, 11, 11, 0.233);
  }

  /* 登录 */
  .login-wrap {
    width: 400px;
    padding: 20px;
    background-color: #fff;
  }
  .login-wrap .title{
    font-size: 28px;
    text-align: center;
    color: #fc6627;
  }
  .login-wrap .login-form {
    margin-top: 20px;
  }
  input::-webkit-input-placeholder{
    color:#dcdfe6 !important;
  }
  .login-form .btn{
    width: 100%;
    background-color: #66b1ff;
    border: 1px solid #66b1ff;
  }
  .login-form .item:nth-child(n + 1) {
    margin-top: 20px;
  }
  .form-control,.btn{
    width: 360px;
    height: 40px;
    border-radius: 4px;
    padding: 0;
    border: 1px solid rgba(161, 160, 160, 0.863);
  }
  .form-control{
    padding:  0 15px;
  }
  .btn:hover{
    cursor: pointer;
  }
  </style>
</head>

<body>
  <!-- 警告框 -->
  <div class="alert info-box">
    操作结果
  </div>
  <!-- 登录页面 -->
  <div class="login-wrap">
    <div class="title">黑马头条</div>
    <div>
      <form class="login-form">
        <div class="item">
          <input type="text" class="form-control" name="mobile" placeholder="请输入手机号" value="13888888888">
        </div>
        <div class="item">
          <input type="text" class="form-control" name="code" placeholder="默认验证码246810" value="246810">
        </div>
        <div class="item">
          <button type="button" class="btn btn-primary btn">登 录</button>
        </div>
      </form>
    </div>
  </div>
  <!-- 引入代码库 -->
  <script src="../../../form-serialize插件.js"></script>
  <script src="../../../jquery-1.12.4.min.js"></script>
  <script src="../../../bootstrap.css"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="../Utils/request.js"></script>
  <script src="../Utils/alert.js"></script>
  <script>
    document.querySelector('.btn').addEventListener('click',function(){
      // 获取表单信息
      const form=document.querySelector('.login-form')
      const data=serialize(form,{hash:true,empty:true})
      // 基于 axios 调用验证码登录接口
      axios({
        url:'/v1_0/authorizations',
        method:'post',
        data
      }).then(result=>{
        myAlert(true,'登陆成功！') 
        // 将 token 保存在本地，并跳转到内容页面
        console.log(result)
        localStorage.setItem('token',result.data.token)
        // localStorage.removeItem('token')
        // 延迟跳转，让 alert 警告框停留一下
        setTimeout(()=>{
        location.href='../content/index.html'
        },2000)
      }).catch(error=>{
        // 失败原因提示
        myAlert(false,error.response.data.message)
      })
    })
  </script>
</body>

</html>
