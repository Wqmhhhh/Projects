<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.2.3/css/bootstrap.min.css">
  <link rel="stylesheet"
    href="https://at.alicdn.com/t/c/font_4001111_4jrdiaeyvuy.css?spm=a313x.7781069.1998910419.52&file=font_4001111_4jrdiaeyvuy.css">
  <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.10.3/font/bootstrap-icons.min.css">
  <title>首页-内容管理</title>
  <style>
        html, body{
      height: 100%;
    }
    .wrap{
      min-height: 100%;
      display: flex;
    }

    /* 侧边栏 */
    .aside {
      width: 200px;
      background-color: #023;
      padding-top: 40px;
    }
    .aside h2 {
      text-align: center;
      color: #fc6627;
    }

    /* 侧边栏导航 */
    .nav{
      padding-left: 20px;
    }
    .nav li {
      width: 100%;
      height: 60px;
      line-height: 60px;
      color: white;
      cursor: pointer;
      list-style: none;
    }
    .nav li a{
      color: white;
      text-decoration: none;
    }
    .nav li a.active{
      color: #409eff !important;
    }

    /* 内容区域 */
    .main{
      height: 100%;
      flex: 1;
    }
    .top-nav{
      height: 60px;
      border-bottom: 1px solid #ddd;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding-right: 40px;
    }
    .nav-item span{
      cursor: pointer;
    }
    .nav-item span:last-of-type{
      margin-left: 20px;
    }

    /* 卡片容器布局 */
    .content{
      padding: 30px;
    }
    .card{
      box-shadow: 0 2px 12px 0 rgb(0 0 0 / 10%);
      border: 1px solid #ebeef5;
      padding: 20px;
    }
    .card:nth-child(n + 2){
      margin-top: 30px;
    }
    .card .title{
      height: 50px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid #ebeef5;
      
    }

    /* 表单部分 */
    .form-check, .form-select{
      display: inline-block;
      margin-left: 10px;
    }
    .form-select{
      width: auto;
    }
    .body form>div {
      margin-top: 20px;
    }

    /* 表格列表部分 */
    .table img {
      width: 100px;
      height: 100px;
    }
    .table .bi{
      cursor: pointer;
    }

    /* 分页 */
    .page-now{
      line-height: 40px;
      padding: 0 20px;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <!-- 侧边栏 -->
    <div class="aside">
      <h2>黑马头条</h2>
      <ul class="nav">
        <li>
          <a href="./index.html" class="active">
            <span class="iconfont icon-16"></span>
            <span>内容管理</span>
          </a>
        </li>
        <li>
          <a href="../publish/index.html">
            <span class="iconfont icon-fabu"></span>
            <span>发布文章</span>
          </a>
        </li>
      </ul>
    </div>
    <!-- 右侧区域 -->
    <div class="main">
      <!-- 顶部导航 -->
      <div class="top-nav">
        <div class="nav-item">
          <span class="nick-name">昵称</span>
          <span class="quit">退出</span>
        </div>
      </div>
      <!-- 内容区域 -->
      <div class="content">
        <!-- 筛选 -->
        <div class="card">
          <div class="title">
            <span>内容管理</span>
          </div>
          <div class="body">
            <form class="sel-form">
              <div>
                <label class="form-label">状态:</label>
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="status" value="" id="all" checked>
                  <label class="form-check-label" for="all">
                    全部
                  </label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="status" value="1" id="audit">
                  <label class="form-check-label" for="audit">
                    待审核
                  </label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="status" value="2" id="approved">
                  <label class="form-check-label" for="approved">
                    审核通过
                  </label>
                </div>
              </div>
              <div>
                <label class="form-label">频道:</label>
                <select class="form-select" name="channel_id">
                </select>
              </div>
              <div>
                <button type="button" class="btn btn-primary sel-btn">筛选</button>
              </div>
            </form>
          </div>
        </div>
        <!-- 内容列表 -->
        <div class="card">
          <table class="table table-striped table-hover">
            <thead>
              <tr>
                <th>封面</th>
                <th>标题</th>
                <th>状态</th>
                <th>发布时间</th>
                <th>阅读数</th>
                <th>评论数</th>
                <th>点赞数</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody class="align-middle art-list">
            </tbody>
          </table>
          <!-- 分页 -->
          <nav>
            <ul class="pagination">
              <li class="page-item last">
                <a class="page-link" href="javascript:;">
                  <span>&laquo;</span>
                </a>
              </li>
              <li class="page-item page-now">
                第1页
              </li>
              <li class="page-item next">
                <a class="page-link" href="javascript:;">
                  <span>&raquo;</span>
                </a>
              </li>
              <li>
                <span class="total-count page-now"></span>
              </li>
            </ul>
          </nav>
        </div>
      </div>
    </div>
  </div>
   <!-- 引入代码库 -->
   <script src="../../../form-serialize插件.js"></script>
   <script src="../../../jquery-1.12.4.min.js"></script>
   <script src="../../../bootstrap.css"></script>
   <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
   <script src="../Utils/request.js"></script>
  <script src="../Utils/auth.js"></script>
  <script>
    // 设置文章下拉菜单
    async function setChannleList(){
      const res=await axios({
        url:'/v1_0/channels'
      })
      const inner=res.data.channels.map(item=>` <option value="${item.id}">${item.name}</option>`).join('')
      document.querySelector('.form-select').innerHTML=' <option value="" selected>全部</option>'+inner
    }
    setChannleList()

    // 获取文章列表并展示
    const queryObj={
      status:'',     //文章状态
      channel_id:'',  // 文章频道
      page:1,   //当前页码
      per_page:2,  // 当前每页的条数
    }
    let totalCount=0   //文章总条数
    async function setAtrList(){
      const res = await axios({
        url:'/v1_0/mp/articles',
        params:queryObj
      })
      const HTMLStr=res.data.results.map(item=>`
        <tr>
          <td>
            <img src="${item.cover.type===0 ? 'https://img2.baidu.com/it/u=2640406343,1419332367&fm=253&fmt=auto&app=138&f=JPEG?w=708&h=500' : item.cover.images[0]}">
          </td>
          <td>${item.title}</td>
          <td>
            ${item.status===2?`<span class="badge text-bg-success">审核通过</span>`:`<span class="badge text-bg-primary">待审核</span>`}
          </td>
          <td>
            <span>${item.pubdate}</span>
          </td>
          <td>
            <span>${item.read_count}</span>
          </td>
          <td>
            <span>0</span>
          </td>
          <td>
            <span>${item.like_count}</span>
          </td>
          <td data-id=${item.id}>
            <i class="bi bi-pencil-square edit"></i>
            <i class="bi bi-trash3 del"></i>
          </td>
        </tr>
      `).join('')
      document.querySelector('.art-list').innerHTML=HTMLStr
      totalCount=res.data.total_count
      document.querySelector('.total-count').innerHTML=`共${totalCount}条`
    }
    setAtrList()

    // 筛选功能
    // 筛选状态
    document.querySelectorAll('.form-check-input').forEach(radio=>{
      radio.addEventListener('change',e=>{
        queryObj.status=e.target.value
      })
    })
    // 筛选频道
    document.querySelector('.form-select').addEventListener('change',e=>{
      queryObj.channel_id=e.target.value
    })
    document.querySelector('.sel-btn').addEventListener('click',()=>{
      setAtrList()
    })

    // 分页管理
    document.querySelector('.next').addEventListener('click',()=>{
      if(queryObj.page<Math.ceil(totalCount/queryObj.per_page)){
        queryObj.page++
        document.querySelector('.page-now').innerHTML=`第${queryObj.page}页`
        setAtrList()
      }
    })
    document.querySelector('.last').addEventListener('click',()=>{
      if(queryObj.page>1){
        queryObj.page--
        document.querySelector('.page-now').innerHTML=`第${queryObj.page}页`
        setAtrList()
      }
    })

    // 删除功能
    document.querySelector('.art-list').addEventListener('click',async e=>{
      // 判断点击的是删除按钮
      if(e.target.classList.contains('del')){
        const delId=e.target.parentNode.dataset.id
        const res = await axios({
          url:`/v1_0/mp/articles/${delId}`,
          method:'delete',
        })
        // 判断删除的是最后一页的最后一条，自动向前翻页
        const children=document.querySelector('.art-list').children
        if(children.length===1 && queryObj.page!=1){
          queryObj.page--
          document.querySelector('.page-now').innerHTML=`第${queryObj.page}页`
        }
        setAtrList()
      }
    })

    // 编辑文章-回显到页面上
    document.querySelector('.art-list').addEventListener('click',async e=>{
      if(e.target.classList.contains('edit')){
        // 使用页面跳转传参
        const artId=e.target.parentNode.dataset.id
        location.href=`../publish/index.html?id=${artId}`  //使用页面跳转传参
      }
    })
  </script>
</body>

</html>
