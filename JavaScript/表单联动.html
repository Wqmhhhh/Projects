  <!-- fetch 实现 -->
  <script>
    const province = document.querySelector('.province')
    const city = document.querySelector('.city')
    const area = document.querySelector('.area')
    const all = document.querySelector('.all')

    // 获取省份数据
    fetch('http://hmajax.itheima.net/api/province')
      .then(response => response.json())
      .then(result => {
        const pro = result.list
        const proStr = pro.map(pname => `<option value="${pname}">${pname}</option>`).join('')
        province.innerHTML = '<option value="">省份</option>' + proStr
      })
      .catch(error => console.error('Error fetching provinces:', error))

    // 省份改变更换对应城市
    province.addEventListener('change', () => {
      fetch(`http://hmajax.itheima.net/api/city?pname=${province.value}`)
        .then(response => response.json())
        .then(result => {
          const ci = result.list
          const ciStr = ci.map(pname => `<option value="${pname}">${pname}</option>`).join('')
          city.innerHTML = '<option value="">城市</option>' + ciStr
          area.innerHTML = '<option value="">区域</option>'
          all.innerHTML = ''
        })
        .catch(error => console.error('Error fetching cities:', error))
    })

    // 城市改变更改对应区域
    city.addEventListener('change', () => {
      fetch(`http://hmajax.itheima.net/api/area?pname=${province.value}&cname=${city.value}`)
        .then(response => response.json())
        .then(result => {
          const ar = result.list
          const arStr = ar.map(pname => `<option value="${pname}">${pname}</option>`).join('')
          area.innerHTML = '<option value="">区域</option>' + arStr
          all.innerHTML = ''
        })
        .catch(error => console.error('Error fetching areas:', error))
    })

    area.addEventListener('change', function() {
      all.innerHTML = province.value + ' --- ' + city.value + ' --- ' + area.value
    })
  </script>
</body>
