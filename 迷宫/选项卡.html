<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>选项卡</title>
  <style>
    .box{
      width: 1400px;
      height: 700px;
      margin: 0px auto;
      background-color: rgba(255, 192, 203, 0.253);
      border-radius: 20px;
      display: flex;
      justify-content: space-around;
      flex-wrap: wrap;
      padding: 10px 10px;
      padding-top: 50px;
    }
    .maze-box{
      width: 400px;
      height: 400px;
      margin: 10px 10px;
      background-color: rgba(206, 152, 211, 0.226);
      display: inline-block;
      border-radius: 20px;
      position: relative;
      top: 0;
      transition-duration: 0.3s;
      transition-property: all;
    }
    .maze-box:hover{
      cursor: pointer;
      top: -10px;
      box-shadow: 3px 4px rgba(199, 198, 198, 0.342);
    }
    img{
      height: 350px;
      margin: 25px 25px;
      display: inline-block;
    }
    .a{
      font-size: 34px;
      color: rgb(88, 18, 88);
      width: 400px;
      height: 70px;
      line-height: 70px;
      text-align: center;
      border-radius: 40px;
      background-color: rgba(221, 163, 233, 0.322);
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="maze-box">
      <img src="./image copy 1.png" value="9">
    </div>
    <div class="maze-box">
      <img src="./image copy 2.png" value="15">
    </div>
    <div class="maze-box">
      <img src="./image copy 3.png" value="21">
    </div>
    <div class="a">- 选择迷宫的复杂度 -</div>
  </div>
  <script>
    const box=document.querySelector(".box")
    box.addEventListener('click',(e)=>{
      if(e.target.tagName=='IMG'){
        document.cookie=`Num=${e.target.getAttribute('value')}`
        location.href='迷宫.html'
      }
    })
  </script>
</body> 
</html>
