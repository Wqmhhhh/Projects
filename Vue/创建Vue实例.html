<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <div id="app">
    {{msg}}
  </div>
  <!-- 引入开发版本的包 -->
  <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>
  <script>
    // 一旦引入VueJS核心包，就有了Vue构造函数
    const app = new Vue({
      // 通过el配置选择器，指定Vue构造函数
      el: '#app',
      data: {
        msg:100
      }
    })
  </script>
</body>

</html>
